name: Probe market source connectivity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          getent ahostsv4 data.moa.gov.tw
          for url in 'http://data.moa.gov.tw/Service/OpenData/FromM/FarmTransData.aspx?StartDate=115.10.26&EndDate=115.10.26' 'https://data.gov.tw/api/v2/rest/dataset/8066' 'https://m.moa.gov.tw/Transaction/AgriculturalProduct/Detail'; do
            curl -4 -k -L --connect-timeout 5 --max-time 10 -o /tmp/response -w "$url HTTP=%{http_code} IP=%{remote_ip} time=%{time_total}\n" "$url" || true
          done
