name: Probe market source connectivity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: bash
        run: |
          curl -4 -k -L --connect-timeout 5 --max-time 15 -o response.json -w 'HTTP=%{http_code} IP=%{remote_ip} time=%{time_total}\n' 'https://data.moa.gov.tw/Service/OpenData/FromM/FarmTransData.aspx?StartDate=115.10.26&EndDate=115.10.26' || true
