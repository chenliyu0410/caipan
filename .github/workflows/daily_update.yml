name: 每日自動更新農產品行情數據

on:
  schedule:
    # 台灣時間每日早上 08:00 (UTC 00:00) 與中午 12:00 (UTC 04:00) 自動執行
    - cron: '0 0,4 * * *'
  workflow_dispatch: # 支援在 GitHub 頁面上一鍵手動觸發

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 執行行情爬蟲與指標計算
        run: |
          python scripts/fetch_data.py

      - name: 提交並推送最新數據至 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json data/latest.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: 每日自動更新農產品行情數據 [skip ci]"
            git push
          else
            echo "今日行情已是最新，無需提交。"
          fi
