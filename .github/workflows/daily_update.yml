name: 每日自動更新農產品行情數據

on:
  schedule:
    # 台灣時間每日 08:00、12:00、15:00、18:00 自動執行（GitHub 排程可能延遲）
    - cron: '0 0,4,7,10 * * *'
  workflow_dispatch: # 支援在 GitHub 頁面上一鍵手動觸發

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v5

      # fetch_data.py 只用標準函式庫，沒有 requirements.txt，因此不開 pip 快取
      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 驗證行情抓取錯誤處理
        run: python -m unittest discover -s tests

      - name: 執行行情爬蟲與指標計算
        run: |
          python scripts/fetch_data.py

      - name: 提交並推送最新數據至 GitHub
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json data/latest.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: 每日自動更新農產品行情數據 [skip ci]"
            git push
          else
            echo "今日行情已是最新，無需提交。"
          fi
